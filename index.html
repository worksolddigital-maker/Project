<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06090f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Finance 3D — gerenciador financeiro pessoal: contas da casa, entradas, empréstimos, cartões, calendário, relatórios e análises.">
  <title>Finance 3D — Gerenciador Financeiro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v13L16 30 3 22.5v-13z' fill='%230f1a14'/%3E%3Cpath d='M16 2 29 9.5 16 17 3 9.5z' fill='%2342e08f'/%3E%3Cpath d='M3 9.5 16 17v13L3 22.5z' fill='%23209e5c'/%3E%3Cpath d='M29 9.5 16 17v13l13-7.5z' fill='%23136b3d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <!-- Preloader / cinematic intro -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-inner">
      <svg class="preloader-logo" viewBox="0 0 64 64" aria-hidden="true">
        <path class="pl-top" d="M32 4 58 19 32 34 6 19z"/>
        <path class="pl-left" d="M6 19 32 34v26L6 45z"/>
        <path class="pl-right" d="M58 19 32 34v26l26-15z"/>
      </svg>
      <div class="preloader-word"><span>Finance</span><strong>3D</strong></div>
      <div class="preloader-bar"><i></i></div>
    </div>
  </div>

  <!-- Ambient 3D background -->
  <div class="bg" aria-hidden="true">
    <div class="bg-glow bg-glow--a"></div>
    <div class="bg-glow bg-glow--b"></div>
    <div class="bg-glow bg-glow--c"></div>
    <div class="bg-floor"><div class="bg-grid"></div></div>
    <div class="bg-noise"></div>
  </div>
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <a class="skip-link" href="#view">Pular para o conteúdo</a>

  <div class="app" id="app">
    <!-- Sidebar (desktop / tablet) -->
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#/dashboard" aria-label="Finance 3D — visão geral">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path class="bm-top" d="M32 4 58 19 32 34 6 19z"/>
          <path class="bm-left" d="M6 19 32 34v26L6 45z"/>
          <path class="bm-right" d="M58 19 32 34v26l26-15z"/>
        </svg>
        <span class="brand-text"><span>Finance</span><strong>3D</strong></span>
      </a>

      <nav class="nav" id="nav">
        <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
        <a class="nav-link" href="#/dashboard" data-route="dashboard"><i data-icon="LayoutDashboard"></i><span>Visão geral</span></a>
        <a class="nav-link" href="#/contas" data-route="contas"><i data-icon="House"></i><span>Contas da casa</span><b class="nav-badge" data-badge="contas" hidden></b></a>
        <a class="nav-link" href="#/entradas" data-route="entradas"><i data-icon="BanknoteArrowUp"></i><span>Entradas</span></a>
        <a class="nav-link" href="#/emprestimos" data-route="emprestimos"><i data-icon="Landmark"></i><span>Empréstimos</span></a>
        <a class="nav-link" href="#/cartoes" data-route="cartoes"><i data-icon="CreditCard"></i><span>Cartões</span></a>
        <a class="nav-link" href="#/calendario" data-route="calendario"><i data-icon="CalendarDays"></i><span>Calendário</span></a>
        <a class="nav-link" href="#/relatorios" data-route="relatorios"><i data-icon="ChartColumn"></i><span>Relatórios</span></a>
        <a class="nav-link" href="#/inteligencia" data-route="inteligencia"><i data-icon="Brain"></i><span>Inteligência</span><b class="nav-badge nav-badge--warn" data-badge="alertas" hidden></b></a>
        <a class="nav-link" href="#/ajustes" data-route="ajustes"><i data-icon="Settings"></i><span>Ajustes</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="save-state" id="saveState" title="Os dados ficam salvos neste navegador">
          <i data-icon="ShieldCheck"></i>
          <span><b>Salvamento automático</b><small id="saveStateText">Dados locais</small></span>
        </div>
      </div>
    </aside>

    <div class="main">
      <!-- Topbar -->
      <header class="topbar" id="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="viewEyebrow">Finance 3D</span>
          <h1 id="viewTitle">Visão geral</h1>
        </div>

        <div class="topbar-actions">
          <div class="month-picker" id="monthPicker">
            <button class="btn-icon btn-icon--sm" type="button" data-action="month-prev" aria-label="Mês anterior"><i data-icon="ChevronLeft"></i></button>
            <button class="month-current" type="button" data-action="month-toggle" aria-haspopup="dialog" aria-expanded="false" id="monthCurrent">
              <i data-icon="CalendarDays"></i><span id="monthLabel">—</span>
            </button>
            <button class="btn-icon btn-icon--sm" type="button" data-action="month-next" aria-label="Próximo mês"><i data-icon="ChevronRight"></i></button>
            <div class="month-pop" id="monthPop" role="dialog" aria-label="Selecionar mês e ano" hidden></div>
          </div>

          <div class="search" id="search">
            <i data-icon="Search"></i>
            <input id="searchInput" type="search" placeholder="Pesquisar contas, entradas, cartões…" autocomplete="off" aria-label="Pesquisar">
            <kbd class="search-kbd">Ctrl K</kbd>
            <div class="search-results" id="searchResults" role="listbox" hidden></div>
          </div>

          <button class="btn-icon search-mobile" type="button" data-action="search-open" aria-label="Pesquisar"><i data-icon="Search"></i></button>
          <button class="btn-icon" type="button" data-action="toggle-hide" id="hideBtn" aria-pressed="false" aria-label="Ocultar valores" title="Ocultar valores"><i data-icon="Eye"></i></button>
          <button class="btn-icon btn-bell" type="button" data-action="go" data-route="inteligencia" aria-label="Alertas" title="Alertas inteligentes"><i data-icon="Bell"></i><b class="bell-dot" id="bellDot" hidden></b></button>
          <div class="quick-add">
            <button class="btn btn-primary btn-magnetic" type="button" data-action="quick-add" aria-haspopup="menu"><i data-icon="Plus"></i><span>Novo</span></button>
          </div>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação inferior">
    <span class="bn-indicator" id="bnIndicator" aria-hidden="true"></span>
    <a href="#/dashboard" data-route="dashboard"><i data-icon="LayoutDashboard"></i><span>Início</span></a>
    <a href="#/contas" data-route="contas"><i data-icon="House"></i><span>Contas</span></a>
    <button class="bn-fab" type="button" data-action="quick-add" aria-label="Adicionar registro"><i data-icon="Plus"></i></button>
    <a href="#/calendario" data-route="calendario"><i data-icon="CalendarDays"></i><span>Agenda</span></a>
    <button type="button" data-action="more-menu" data-route-group="more"><i data-icon="LayoutGrid"></i><span>Mais</span></button>
  </nav>

  <div id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="restoreInput" accept="application/json,.json" hidden>

  <noscript><div class="noscript">O Finance 3D precisa de JavaScript ativado para funcionar.</div></noscript>

  <!-- Bibliotecas (CDN) — o app funciona mesmo se alguma delas não carregar -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
